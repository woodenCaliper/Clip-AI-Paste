<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clip AI Paste 設定</title>
  <style>
    body { font-family: sans-serif; max-width: 840px; margin: 20px auto; padding: 0 12px; }
    label { display:block; margin-top: 12px; font-weight: 600; }
    input, textarea, select { width:100%; box-sizing:border-box; padding:8px; margin-top:4px; }
    textarea { min-height: 140px; }
    .row { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; }
    button { margin-top: 16px; padding: 8px 14px; }
    #status { margin-left: 12px; color: #166534; }
    .subtle { margin-top:8px;color:#374151;font-size:13px; }
    #previewArea { min-height: 180px; background:#f9fafb; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .toolbar { display:flex; gap:8px; align-items:center; margin-top:8px; }
  </style>
</head>
<body>
  <h1>Clip AI Paste 設定</h1>
  <label>使用AI
    <select id="aiProvider">
      <option value="openai">OpenAI</option>
      <option value="gemini">Gemini</option>
      <option value="claude">Claude</option>
    </select>
  </label>

  <label>OpenAI APIキー<input id="openaiApiKey" type="password" /></label>
  <label>Gemini APIキー<input id="geminiApiKey" type="password" /></label>
  <label>Claude APIキー<input id="claudeApiKey" type="password" /></label>

  <div class="row">
    <label>OpenAI モデル名<input id="openaiModel" type="text" /></label>
    <label>Gemini モデル名<input id="geminiModel" type="text" /></label>
    <label>Claude モデル名<input id="claudeModel" type="text" /></label>
  </div>

  <label>プロンプト<textarea id="prompt"></textarea></label>

  <label>プレビュー用クリップボード内容<textarea id="previewInput" placeholder="ここに貼るか、下のボタンで現在のクリップボードを読み込んでください"></textarea></label>
  <div class="toolbar">
    <button id="loadClipboard" type="button">現在のクリップボードを読み込む</button>
  </div>

  <label>AIへ最終送信されるプロンプト（プレビュー）
    <textarea id="previewArea" readonly></textarea>
  </label>

  <p class="subtle">OpenAI利用時に <code>429</code> が出る場合、課金上限・レート制限・モデル利用権限が原因のことがあります。</p>
  <p class="subtle">※ このプレビューは、実際に送信するフォーマット（# 指示 / # 入力テキスト）をそのまま表示します。</p>

  <p><a href="chrome://extensions/shortcuts" target="_blank" rel="noreferrer">ショートカット設定を開く</a></p>

  <button id="save">保存</button><span id="status"></span>

  <script src="options.js"></script>
</body>
</html>

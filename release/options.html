<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clip AI Paste 設定</title>
  <style>
    body { font-family: sans-serif; max-width: 840px; margin: 20px auto; padding: 0 12px; }
    label { display:block; margin-top: 12px; font-weight: 600; }
    input, textarea, select { width:100%; box-sizing:border-box; padding:8px; margin-top:4px; }
    textarea { min-height: 140px; }
    .row { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; }
    button { margin-top: 16px; padding: 8px 14px; }
    #status { margin-left: 12px; color: #166534; }
    #dirtyState { margin-left: 12px; color: #b45309; font-weight: 600; }
    .subtle { margin-top:8px;color:#374151;font-size:13px; }
    #previewArea { min-height: 180px; background:#f9fafb; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .provider-group { border: 1px solid #d1d5db; border-radius: 10px; padding: 12px; margin-top: 12px; background: #f9fafb; }
    .provider-group.active { border-color: #2563eb; background: #eff6ff; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12); }
    .provider-group.inactive { opacity: 0.62; }
    .provider-title { margin: 0 0 6px; font-size: 14px; color: #111827; }
  </style>
</head>
<body>
  <h1>Clip AI Paste 設定</h1>
  <label>使用AI
    <select id="aiProvider">
      <option value="openai">OpenAI</option>
      <option value="gemini">Gemini</option>
      <option value="claude">Claude</option>
    </select>
  </label>

  <div class="provider-group" data-provider="openai">
    <p class="provider-title">OpenAI 設定</p>
    <label>OpenAI APIキー<input id="openaiApiKey" type="password" /></label>
    <label>OpenAI モデル名<input id="openaiModel" type="text" /></label>
  </div>
  <div class="provider-group" data-provider="gemini">
    <p class="provider-title">Gemini 設定</p>
    <label>Gemini APIキー<input id="geminiApiKey" type="password" /></label>
    <label>Gemini モデル名<input id="geminiModel" type="text" /></label>
  </div>
  <div class="provider-group" data-provider="claude">
    <p class="provider-title">Claude 設定</p>
    <label>Claude APIキー<input id="claudeApiKey" type="password" /></label>
    <label>Claude モデル名<input id="claudeModel" type="text" /></label>
  </div>

  <label>指示プロンプト<textarea id="prompt"></textarea></label>


  <label>AIへ最終送信されるプロンプト（プレビュー）
    <textarea id="previewArea" readonly></textarea>
  </label>

  <p class="subtle">OpenAI利用時に <code>429</code> が出る場合、課金上限・レート制限・モデル利用権限が原因のことがあります。</p>
  <p class="subtle">※ このプレビューは実際の送信フォーマットを表示し、入力テキスト部分は固定で「＜ここにクリップボードの内容＞」を表示します。</p>

  <p><a id="shortcutLink" href="#">ショートカット設定を開く</a></p>

  <button id="save">保存</button><span id="status"></span><span id="dirtyState"></span>

  <script src="options.js"></script>
</body>
</html>

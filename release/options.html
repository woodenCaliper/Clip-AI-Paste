<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clip AI Paste 設定</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px;
    }
    .header-inner {
      max-width: 840px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
    }
    .header-title {
      margin: 0;
      font-size: 22px;
    }
    .header-status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-height: 72px;
      width: 100%;
      padding-right: 120px;
      justify-content: flex-end;
    }
    .save-wrap {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .page-content { max-width: 840px; margin: 20px auto; padding: 0 12px 20px; }
    label { display:block; margin-top: 12px; font-weight: 600; }
    input, textarea, select { width:100%; box-sizing:border-box; padding:8px; margin-top:4px; }
    textarea { min-height: 140px; }
    .row { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; }
    button { margin-top: 16px; padding: 8px 14px; }
    .header-save { margin-top: 0; white-space: nowrap; }
    #status { color: #166534; }
    #dirtyState { color: #b91c1c; font-weight: 600; text-align: right; }
    .subtle { margin-top:8px;color:#374151;font-size:13px; }
    #previewArea { min-height: 180px; background:#f9fafb; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .provider-group { border: 1px solid #d1d5db; border-radius: 10px; padding: 12px; margin-top: 12px; background: #f9fafb; }
    .provider-group.active { border-color: #2563eb; background: #eff6ff; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12); }
    .provider-group.inactive { opacity: 0.62; }
    .provider-title { margin: 0 0 6px; font-size: 14px; color: #111827; }
    .field-error { margin-top: 6px; color: #b91c1c; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <header class="sticky-header">
    <div class="header-inner">
      <h1 class="header-title">Clip AI Paste 設定</h1>
      <div class="header-status">
        <span id="status"></span>
        <div class="save-wrap">
          <button id="save" class="header-save" type="button">保存</button>
          <span id="dirtyState"></span>
        </div>
      </div>
    </div>
  </header>

  <main class="page-content">
  <p><a id="shortcutLink" href="#">ショートカット設定を開く</a></p>
  <p id="shortcutError" class="field-error" aria-live="polite"></p>

  <label>使用AI
    <select id="aiProvider">
      <option value="openai">OpenAI</option>
      <option value="gemini">Gemini</option>
      <option value="claude">Claude</option>
    </select>
  </label>
  <p id="providerError" class="field-error" aria-live="polite"></p>

  <div class="provider-group" data-provider="openai">
    <p class="provider-title">OpenAI 設定</p>
    <label>OpenAI APIキー<input id="openaiApiKey" type="password" /></label>
    <label>OpenAI モデル名<input id="openaiModel" type="text" /></label>
  </div>
  <div class="provider-group" data-provider="gemini">
    <p class="provider-title">Gemini 設定</p>
    <label>Gemini APIキー<input id="geminiApiKey" type="password" /></label>
    <label>Gemini モデル名<input id="geminiModel" type="text" /></label>
  </div>
  <div class="provider-group" data-provider="claude">
    <p class="provider-title">Claude 設定</p>
    <label>Claude APIキー<input id="claudeApiKey" type="password" /></label>
    <label>Claude モデル名<input id="claudeModel" type="text" /></label>
  </div>

  <label>指示プロンプト<textarea id="prompt"></textarea></label>


  <label>AIへ最終送信されるプロンプト（プレビュー）
    <textarea id="previewArea" readonly></textarea>
  </label>

  <p class="subtle">OpenAI利用時に <code>429</code> が出る場合、課金上限・レート制限・モデル利用権限が原因のことがあります。</p>


  <script src="options.js"></script>
  </main>
</body>
</html>
